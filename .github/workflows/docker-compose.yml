name: Docker Compose CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Create environment file
      run: cp .env.example .env

    - name: Validate Docker Compose file
      run: docker compose config

    - name: Pull services
      run: docker compose pull

    - name: Run services
      run: docker compose up -d

    - name: Check if WordPress is running
      run: |
        for i in $(seq 1 30); do
          curl -fsS http://localhost:8833 && exit 0
          sleep 5
        done
        echo "WordPress is not running!"
        docker compose logs wordpress
        exit 1

    - name: Check database connection
      run: |
        set -a
        . ./.env
        set +a
        docker compose exec -T database mariadb-admin ping -h localhost -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent

    - name: List running containers (debugging)
      run: docker compose ps

    - name: Clean up services
      if: always()
      run: docker compose down
